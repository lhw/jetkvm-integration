[project]
name = "jetkvm-integration"
version = "0.1.0"
description = "Home Assistant integration for JetKVM screen + keyboard (companions native MQTT mode)"
requires-python = ">=3.13.2"

[dependency-groups]
dev = [
    "homeassistant==2026.2.3",
    "pytest-homeassistant-custom-component==0.13.316",
    "aioresponses==0.7.9",
    "ruff==0.16.5",
]

[tool.uv]
# HACS copies the custom_components/ folder; the project itself is never
# built or pip-installed, so keep it virtual.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "RUF"]
ignore = ["S101", "B011"]
